syntax = "proto3";

package pb.stats.merchant;

option go_package = 'github.com/MamangRust/microservice-payment-gateway-grpc/pb/stats/merchant';

import "merchant/merchant.proto";

message MerchantResponseMonthlyAmount {
  string month = 1;
  int64 total_amount = 2;
}

message MerchantResponseYearlyAmount {
  string year = 1;
  int64 total_amount = 2;
}

message ApiResponseMerchantMonthlyAmount {
  string status = 1;
  string message = 2;
  repeated MerchantResponseMonthlyAmount data = 3;
}

message ApiResponseMerchantYearlyAmount {
  string status = 1;
  string message = 2;
  repeated MerchantResponseYearlyAmount data = 3;
}

service MerchantStatsAmountService {
  rpc FindMonthlyAmountMerchant(pb.merchant.FindYearMerchant)
      returns (ApiResponseMerchantMonthlyAmount) {}
  rpc FindYearlyAmountMerchant(pb.merchant.FindYearMerchant)
      returns (ApiResponseMerchantYearlyAmount) {}
  rpc FindMonthlyAmountByMerchants(pb.merchant.FindYearMerchantById)
      returns (ApiResponseMerchantMonthlyAmount) {}
  rpc FindYearlyAmountByMerchants(pb.merchant.FindYearMerchantById)
      returns (ApiResponseMerchantYearlyAmount) {}
  rpc FindMonthlyAmountByApikey(pb.merchant.FindYearMerchantByApikey)
      returns (ApiResponseMerchantMonthlyAmount) {}
  rpc FindYearlyAmountByApikey(pb.merchant.FindYearMerchantByApikey)
      returns (ApiResponseMerchantYearlyAmount) {}
}