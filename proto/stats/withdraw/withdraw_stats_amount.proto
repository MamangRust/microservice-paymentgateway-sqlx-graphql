syntax = "proto3";

option go_package = 'github.com/MamangRust/microservice-payment-gateway-grpc/pb/stats/withdraw';

package pb.stats.withdraw;

import "withdraw/withdraw.proto";

message WithdrawMonthlyAmountResponse {
  string month = 1;
  int64 total_amount = 2;
}

message WithdrawYearlyAmountResponse {
  string year = 1;
  int64 total_amount = 2;
}

message ApiResponseWithdrawMonthAmount {
  string status = 1;
  string message = 2;
  repeated WithdrawMonthlyAmountResponse data = 3;
}

message ApiResponseWithdrawYearAmount {
  string status = 1;
  string message = 2;
  repeated WithdrawYearlyAmountResponse data = 3;
}

service WithdrawStatsAmountService {
  rpc FindMonthlyWithdraws(pb.withdraw.FindYearWithdrawStatus)
      returns (ApiResponseWithdrawMonthAmount) {}
  rpc FindYearlyWithdraws(pb.withdraw.FindYearWithdrawStatus)
      returns (ApiResponseWithdrawYearAmount) {}

  rpc FindMonthlyWithdrawsByCardNumber(pb.withdraw.FindYearWithdrawCardNumber)
      returns (ApiResponseWithdrawMonthAmount) {}
  rpc FindYearlyWithdrawsByCardNumber(pb.withdraw.FindYearWithdrawCardNumber)
      returns (ApiResponseWithdrawYearAmount) {}
}