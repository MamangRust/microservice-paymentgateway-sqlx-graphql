syntax = "proto3";

option go_package = 'github.com/MamangRust/microservice-payment-gateway-grpc/pb/stats/transaction';

package pb.stats.transaction;

import "transaction/transaction.proto";

message TransactionMonthAmountResponse {
  string month = 1;
  int64 total_amount = 2;
}

message TransactionYearlyAmountResponse {
  string year = 1;
  int64 total_amount = 2;
}

message ApiResponseTransactionMonthAmount {
  string status = 1;
  string message = 2;
  repeated TransactionMonthAmountResponse data = 3;
}

message ApiResponseTransactionYearAmount {
  string status = 1;
  string message = 2;
  repeated TransactionYearlyAmountResponse data = 3;
}

service TransactionStatsAmountService {
  rpc FindMonthlyAmounts(pb.transaction.FindYearTransactionStatus)
      returns (ApiResponseTransactionMonthAmount) {}
  rpc FindYearlyAmounts(pb.transaction.FindYearTransactionStatus)
      returns (ApiResponseTransactionYearAmount) {}
  rpc FindMonthlyAmountsByCardNumber(pb.transaction.FindByYearCardNumberTransactionRequest)
      returns (ApiResponseTransactionMonthAmount) {}
  rpc FindYearlyAmountsByCardNumber(pb.transaction.FindByYearCardNumberTransactionRequest)
      returns (ApiResponseTransactionYearAmount) {}
}