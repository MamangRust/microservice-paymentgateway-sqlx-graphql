syntax = "proto3";

package pb.stats.card;

option go_package = 'github.com/MamangRust/microservice-payment-gateway-grpc/pb/stats/card';

import "card/card.proto";

service CardStatsTopupService {
  rpc FindMonthlyTopupAmount(pb.card.FindYearAmount)
      returns (pb.card.ApiResponseMonthlyAmount) {}
  rpc FindYearlyTopupAmount(pb.card.FindYearAmount) returns (pb.card.ApiResponseYearlyAmount) {}

  rpc FindMonthlyTopupAmountByCardNumber(pb.card.FindYearAmountCardNumber)
      returns (pb.card.ApiResponseMonthlyAmount) {}
  rpc FindYearlyTopupAmountByCardNumber(pb.card.FindYearAmountCardNumber)
      returns (pb.card.ApiResponseYearlyAmount) {}
}
