syntax = "proto3";

package pb.stats.card;

option go_package = 'github.com/MamangRust/microservice-payment-gateway-grpc/pb/stats/card';

import "card/card.proto";

service CardStatsTransactionService {
  rpc FindMonthlyTransactionAmount(pb.card.FindYearAmount)
      returns (pb.card.ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransactionAmount(pb.card.FindYearAmount)
      returns (pb.card.ApiResponseYearlyAmount) {}

  rpc FindMonthlyTransactionAmountByCardNumber(pb.card.FindYearAmountCardNumber)
      returns (pb.card.ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransactionAmountByCardNumber(pb.card.FindYearAmountCardNumber)
      returns (pb.card.ApiResponseYearlyAmount) {}
}
