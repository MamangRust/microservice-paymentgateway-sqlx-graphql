# docker-compose.infra.yml
#
# Infrastructure-only compose file for local e2e testing.
# Go services run on the host via `go run`; this file provides databases,
# message broker, cache, and analytics store inside Docker.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml --profile monitoring up -d   # + jaeger/otel/prometheus/grafana

name: e2e-infra

services:
  # ─── PostgreSQL: 1 database = 1 bounded context, masing-masing di depan
  # PgBouncer. Service Go di host connect lewat port host PgBouncer
  # (6432/6433/6434) memakai .env (DB_<CONTEXT>_HOST=localhost). ─────────────
  postgres_identity:
    image: postgres:17-alpine
    container_name: e2e-postgres-identity
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_identity
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_identity:
    image: edoburu/pgbouncer:latest
    container_name: e2e-pgbouncer-identity
    environment:
      DB_HOST: postgres_identity
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: pg_identity
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6432:5432"
    networks:
      - e2e
    depends_on:
      postgres_identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pg_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_payment:
    image: postgres:17-alpine
    container_name: e2e-postgres-payment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_payment
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_payment"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_payment:
    image: edoburu/pgbouncer:latest
    container_name: e2e-pgbouncer-payment
    environment:
      DB_HOST: postgres_payment
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: pg_payment
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6433:5432"
    networks:
      - e2e
    depends_on:
      postgres_payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pg_payment"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_financial:
    image: postgres:17-alpine
    container_name: e2e-postgres-financial
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_financial
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_financial_data:/var/lib/postgresql/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_financial"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_financial:
    image: edoburu/pgbouncer:latest
    container_name: e2e-pgbouncer-financial
    environment:
      DB_HOST: postgres_financial
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: pg_financial
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6434:5432"
    networks:
      - e2e
    depends_on:
      postgres_financial:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pg_financial"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis (single node for local dev) ────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: e2e-redis
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6379:6379"
    networks:
      - e2e
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dragon_knight", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (single-node KRaft) ────────────────────────────────────────
  kafka:
    image: apache/kafka:4.3.1
    container_name: e2e-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # CLUSTER_ID (bukan KAFKA_CLUSTER_ID) adalah key yang dibaca
      # /etc/kafka/docker/configure; nilai lama diabaikan dan image jatuh ke
      # default bawaannya.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 10
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 5000
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 3000
      KAFKA_CONTROLLER_QUORUM_RETRY_BACKOFF_MS: 500
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092 && echo ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── ClickHouse (analytics / stats) ───────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: e2e-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../pkg/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - e2e
    environment:
      CLICKHOUSE_USER: dragon
      CLICKHOUSE_PASSWORD: dragon_knight
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Observability (optional, enable with --profile monitoring) ────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: e2e-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - e2e
    profiles:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: e2e-jaeger
    ports:
      - "16686:16686"
    networks:
      - e2e
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: e2e-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ../../observability/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - e2e
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: e2e-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - e2e
    depends_on:
      - prometheus
      - jaeger
    profiles:
      - monitoring

volumes:
  postgres_identity_data:
  postgres_payment_data:
  postgres_financial_data:
  clickhouse_data:

networks:
  e2e:
    driver: bridge
